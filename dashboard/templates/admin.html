<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTForensics - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #e0e0e0;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button.btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f5f5f5;
            font-weight: 600;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span>🔐</span>
                ZTForensics Admin Panel
            </h1>
            <p style="color: #666; margin-top: 10px;">Manage users, policies, and security settings</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('dashboard')">📊 Dashboard</button>
            <button class="tab-button" onclick="showTab('users')">👥 Users</button>
            <button class="tab-button" onclick="showTab('policies')">📋 Policies</button>
            <button class="tab-button" onclick="showTab('locations')">📍 Locations</button>
            <button class="tab-button" onclick="showTab('devices')">🖥️ Devices</button>
            <button class="tab-button" onclick="showTab('risk-rules')">⚙️ Risk Rules</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="tab-content active">
            <h2>Dashboard Overview</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">1,247</div>
                    <div class="stat-label">Total Accesses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #2ed573;">1,198</div>
                    <div class="stat-label">Allowed ✅</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #ff4757;">35</div>
                    <div class="stat-label">Denied ❌</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #ffa502;">14</div>
                    <div class="stat-label">Alerts ⚠️</div>
                </div>
            </div>
        </div>

        <!-- USERS -->
        <div id="users" class="tab-content">
            <h2>👥 User Management</h2>
            <form onsubmit="addUser(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="role" required>
                        <option value="">Select Role</option>
                        <option value="ADMIN">Admin</option>
                        <option value="USER">User</option>
                        <option value="VIEWER">Viewer</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">➕ Add User</button>
            </form>
            <div id="users-list"></div>
        </div>

        <!-- POLICIES -->
        <div id="policies" class="tab-content">
            <h2>📋 Policy Management</h2>
            <form onsubmit="addPolicy(event)">
                <div class="form-group">
                    <label>Policy Name</label>
                    <input type="text" id="policy-name" placeholder="e.g., Allow office hours access" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Risk Threshold</label>
                        <input type="number" id="policy-threshold" min="0" max="100" placeholder="50" required>
                    </div>
                    <div class="form-group">
                        <label>Action</label>
                        <select id="policy-action" required>
                            <option value="ALLOW">ALLOW</option>
                            <option value="DENY">DENY</option>
                            <option value="ALERT">ALERT</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">➕ Create Policy</button>
            </form>
            <div id="policies-list"></div>
        </div>

        <!-- LOCATIONS -->
        <div id="locations" class="tab-content">
            <h2>📍 Location Whitelisting</h2>
            <form onsubmit="addLocation(event)">
                <div class="form-group">
                    <label>Location Name</label>
                    <input type="text" id="location-name" placeholder="e.g., Mumbai Office" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>IP Range</label>
                        <input type="text" id="location-ip" placeholder="e.g., 192.168.1.0/24" required>
                    </div>
                    <div class="form-group">
                        <label>City/Country</label>
                        <input type="text" id="location-city" placeholder="e.g., Mumbai, India" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">➕ Add Location</button>
            </form>
            <div id="locations-list"></div>
        </div>

        <!-- DEVICES -->
        <div id="devices" class="tab-content">
            <h2>🖥️ Device Whitelisting</h2>
            <form onsubmit="addDevice(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="device-user" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Device Name</label>
                    <input type="text" id="device-name" placeholder="e.g., CEO Laptop" required>
                </div>
                <button type="submit" class="btn btn-primary">➕ Whitelist Device</button>
            </form>
            <div id="devices-list"></div>
        </div>

        <!-- RISK RULES -->
        <div id="risk-rules" class="tab-content">
            <h2>⚙️ Risk Scoring Rules</h2>
            <div id="risk-rules-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function addUser(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch(`${API_BASE}/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, role })
                });
                
                if (response.ok) {
                    alert('✅ User created!');
                    document.getElementById('username').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('role').value = '';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addPolicy(event) {
            event.preventDefault();
            const name = document.getElementById('policy-name').value;
            const risk_threshold = parseInt(document.getElementById('policy-threshold').value);
            const action = document.getElementById('policy-action').value;

            try {
                const response = await fetch(`${API_BASE}/admin/policies`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, risk_threshold, action })
                });
                
                if (response.ok) {
                    alert('✅ Policy created!');
                    document.getElementById('policy-name').value = '';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addLocation(event) {
            event.preventDefault();
            const name = document.getElementById('location-name').value;
            const ip_range = document.getElementById('location-ip').value;
            const location = document.getElementById('location-city').value;

            try {
                const response = await fetch(`${API_BASE}/admin/whitelist/location`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, ip_range, location })
                });
                
                if (response.ok) {
                    alert('✅ Location added!');
                    document.getElementById('location-name').value = '';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addDevice(event) {
            event.preventDefault();
            const user_id = document.getElementById('device-user').value;
            const device_name = document.getElementById('device-name').value;

            try {
                const response = await fetch(`${API_BASE}/admin/whitelist/device`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, device_name })
                });
                
                if (response.ok) {
                    alert('✅ Device whitelisted!');
                    document.getElementById('device-user').value = '';
                    document.getElementById('device-name').value = '';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
