<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ZTForensics Dashboard{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f0f4f8; color: #1a202c; }
    a { color: inherit; text-decoration: none; }

    /* Navbar */
    nav { background: #1a3a5c; color: #fff; padding: 0 1.5rem;
          display: flex; align-items: center; height: 56px; gap: 1.5rem; }
    nav .brand { font-weight: 700; font-size: 1.1rem; margin-right: 1.5rem; }
    nav a { opacity: .8; font-size: .9rem; padding: .3rem .6rem; border-radius: 4px;
             transition: opacity .2s; }
    nav a:hover, nav a.active { opacity: 1; background: rgba(255,255,255,.12); }

    /* Layout */
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.6rem; margin-bottom: 1.2rem; color: #1a3a5c; }
    h2 { font-size: 1.2rem; margin-bottom: .8rem; color: #2c5282; }

    /* Cards */
    .card { background: #fff; border-radius: 8px; padding: 1.2rem 1.5rem;
             box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card-grid { display: grid; gap: 1rem;
                 grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .metric { text-align: center; }
    .metric .value { font-size: 2.2rem; font-weight: 700; color: #1a3a5c; }
    .metric .label { font-size: .8rem; color: #718096; margin-top: .2rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { background: #1a3a5c; color: #fff; padding: .5rem .8rem; text-align: left; }
    td { padding: .45rem .8rem; border-bottom: 1px solid #e2e8f0; }
    tr:hover td { background: #f7fafc; }

    /* Badges */
    .badge { display: inline-block; padding: .15rem .55rem; border-radius: 12px;
              font-size: .75rem; font-weight: 600; }
    .badge-red   { background: #fed7d7; color: #c53030; }
    .badge-orange{ background: #feebc8; color: #c05621; }
    .badge-green { background: #c6f6d5; color: #276749; }
    .badge-blue  { background: #bee3f8; color: #2a69ac; }
    .badge-allow { background: #c6f6d5; color: #276749; }
    .badge-deny  { background: #fed7d7; color: #c53030; }

    .mt { margin-top: 1.5rem; }
    .chart-wrap { position: relative; height: 280px; }
    footer { text-align: center; padding: 1.5rem; color: #a0aec0; font-size: .8rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <span class="brand">🔐 ZTForensics</span>
  <a href="/" {% if request.path == '/' or request.path == '/dashboard' %}class="active"{% endif %}>Home</a>
  <a href="/dashboard/timeline" {% if '/timeline' in request.path %}class="active"{% endif %}>Timeline</a>
  <a href="/dashboard/anomalies" {% if '/anomalies' in request.path %}class="active"{% endif %}>Anomalies</a>
  <a href="/dashboard/verify" {% if '/verify' in request.path %}class="active"{% endif %}>Verification</a>
  <a href="/dashboard/evidence" {% if '/evidence' in request.path %}class="active"{% endif %}>Evidence</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<footer>ZTForensics Zero Trust Forensic Gateway — &copy; 2026</footer>
</body>
</html>
