services:
  postgres:
    image: postgres:16.4
    container_name: ztf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ztf-net]

  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: ztf-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ztf-net]

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: ztf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [ztf-net]

  api-gateway:
    build: ./api_gateway
    container_name: ztf-api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks: [ztf-net]

  dashboard:
    build: ./dashboard
    container_name: ztf-dashboard
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    depends_on:
      - api-gateway
    networks: [ztf-net]

volumes:
  postgres_data:
  minio_data:

networks:
  ztf-net:
    driver: bridge