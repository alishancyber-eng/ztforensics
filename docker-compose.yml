services:

  ztf-postgres:
    image: postgres:16.4
    container_name: ztf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ztf
      POSTGRES_PASSWORD: ztfpass
      POSTGRES_DB: ztfdb
    ports:
      - "5432:5432"
    volumes:
      - ztf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztf -d ztfdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ztf-net]

  ztf-keycloak-db:
    image: postgres:16.4
    container_name: ztf-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
      POSTGRES_DB: keycloakdb
    ports:
      - "5433:5432"
    volumes:
      - ztf-keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloakdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ztf-net]

  ztf-keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: ztf-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://ztf-keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      ztf-keycloak-db:
        condition: service_healthy
    networks: [ztf-net]

  ztf-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: ztf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ztf-minio-data:/data
    networks: [ztf-net]

  ztf-opa:
    image: openpolicyagent/opa:0.68.0
    container_name: ztf-opa
    restart: unless-stopped
    command: run --server
    ports:
      - "8181:8181"
    networks: [ztf-net]

  ztf-api:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: ztf-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ztf:ztfpass@ztf-postgres:5432/ztfdb}
      OPA_URL: ${OPA_URL:-http://ztf-opa:8181}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-ztf-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-forensics-evidence}

      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://ztf-keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-forensics}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-api-gateway}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-CHANGE_ME_CLIENT_SECRET}

      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${API_GATEWAY_LOG_LEVEL:-INFO}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      ztf-postgres:
        condition: service_healthy
      ztf-keycloak:
        condition: service_started
    networks: [ztf-net]

  ztf-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ztf-dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://ztf-api:8000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-forensics}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-api-gateway}
      KEYCLOAK_LOGIN_URL: ${KEYCLOAK_LOGIN_URL:-http://localhost:8080/realms/forensics/protocol/openid-connect/auth}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    depends_on:
      ztf-api:
        condition: service_started
    networks: [ztf-net]

volumes:
  ztf-postgres-data:
    name: ztforensics_postgres_data
  ztf-keycloak-db-data:
    name: ztforensics_keycloak_db_data
  ztf-minio-data:
    name: ztforensics_minio_data

networks:
  ztf-net:
    name: ztforensics_ztf-net